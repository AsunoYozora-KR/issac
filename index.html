<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>지하실 듀오</title>

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#eee}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:5}
.panel{text-align:center;max-width:88vw;background:#e9d7a7;color:#3a2010;padding:16px 28px 14px;border:3px solid #2a1a0a;
  box-shadow:inset 0 0 0 3px #f6e9c6,inset 0 -5px 0 3px #c9ab72,0 0 0 3px #000,8px 8px 0 3px rgba(0,0,0,.55)}
h1{margin:0 0 6px;font-size:32px;font-weight:900;letter-spacing:3px;color:#3a1408;text-shadow:2px 2px 0 #c9ab72}
.sub{margin-bottom:14px;font-size:14px;font-weight:700;color:#6a4628}
button{font:inherit;font-weight:900;font-size:16px;padding:9px 20px;margin:5px;border-radius:0;border:3px solid #1a0e04;background:#7a5230;color:#f6e6c4;
  box-shadow:inset -3px -3px 0 #4e321a,inset 3px 3px 0 #a87a4a}
button:active{box-shadow:inset 3px 3px 0 #4e321a;transform:translateY(1px)}
button:disabled{opacity:.4}
button.small{font-size:12px;padding:5px 12px;background:#c9b07c;color:#3a2010;border-color:#3a2010;box-shadow:inset -2px -2px 0 #9a7e4e,inset 2px 2px 0 #e6d2a0}
input{font:inherit;font-weight:900;font-size:24px;width:140px;text-align:center;padding:7px;border-radius:0;border:3px solid #2a1a0a;background:#f8eed4;color:#3a2010;text-transform:uppercase;letter-spacing:6px}
.code{font-size:44px;font-weight:900;letter-spacing:10px;color:#8a1a14;margin:2px 0;text-shadow:3px 3px 0 #c9ab72}
.msg{min-height:20px;margin:8px 0;font-size:14px;font-weight:700;color:#8a2a1a}
.tip{font-size:12px;font-weight:700;color:#6a4628;opacity:.8;margin-top:8px}
#actBtn{position:fixed;right:calc(env(safe-area-inset-right) + 24px);bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:7;display:none;width:56px;height:56px;padding:0;margin:0;
  border:3px solid #1a0e04;background:rgba(201,176,124,.85);border-radius:0;box-shadow:inset -3px -3px 0 #9a7e4e,inset 3px 3px 0 #e6d2a0;overflow:hidden}
#actBtn img{width:42px;height:42px;image-rendering:pixelated;display:block;margin:auto;position:relative;z-index:1}
#actCd{position:absolute;left:0;top:0;width:100%;height:0;background:rgba(20,10,0,.6);z-index:2}
#actBtn.ready{box-shadow:inset -3px -3px 0 #9a7e4e,inset 3px 3px 0 #e6d2a0,0 0 0 3px #ffe080}
#invBtn{position:fixed;top:calc(env(safe-area-inset-top) + 4px);right:calc(env(safe-area-inset-right) + 8px);z-index:7;display:none;padding:4px 10px;margin:0;font-size:13px;line-height:1.2;
  border:2px solid #1a0e04;background:rgba(122,82,48,.88);color:#f6e6c4;border-radius:0;box-shadow:inset -2px -2px 0 #4e321a,inset 2px 2px 0 #a87a4a}
#inv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:8}
.invp{max-height:84vh;overflow:auto;padding:10px 18px 10px;min-width:280px}
.invp h2{margin:0 0 6px;font-size:18px;color:#3a1408}
#invGrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:78vw;margin-bottom:6px}
.icell{position:relative;width:44px;height:44px;padding:0;margin:0;background:#c9b07c;border:2px solid #3a2010;box-shadow:inset -2px -2px 0 #9a7e4e,inset 2px 2px 0 #e6d2a0}
.icell.sel{background:#f6e6c4}
.icell img{width:36px;height:36px;image-rendering:pixelated;display:block;margin:auto}
.icell span{position:absolute;right:1px;bottom:0;font-size:11px;font-weight:900;color:#3a2010}
#invInfo{min-height:38px;font-size:13px;font-weight:700;color:#5a3a1a;margin:4px 0 6px;max-width:78vw}
#invInfo b{font-size:15px;color:#3a1408}
#sndBtn{position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:calc(50% + 46px);z-index:7;width:36px;height:30px;padding:0;margin:0;font-size:16px;line-height:1;
  border:2px solid #1a0e04;background:rgba(122,82,48,.85);color:#f6e6c4;border-radius:0;box-shadow:inset -2px -2px 0 #4e321a,inset 2px 2px 0 #a87a4a}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;z-index:10;font-size:20px;text-align:center;line-height:1.6}
@media (orientation:portrait){#rotate{display:flex}}
#safe{position:fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"><div class="panel" id="panel"></div></div>
<div id="rotate">📱↻<br>화면을 가로로 돌려주세요</div>
<div id="safe"></div>
<button id="actBtn" onclick="pressActive()" aria-label="아이템 사용"><img id="actImg" alt=""><div id="actCd"></div></button>
<button id="invBtn" onclick="openInv()">아이템</button>
<div id="inv" onclick="if(event.target===this) closeInv()"><div class="panel invp"><h2>내가 먹은 아이템</h2><div id="invGrid"></div><div id="invInfo">아이템을 누르면 능력을 볼 수 있어요</div><button class="small" onclick="closeInv()">닫기</button></div></div>
<button id="sndBtn" onclick="toggleSound()" aria-label="소리 켜기/끄기">♪</button>
<script>
'use strict';

 {name:'지하 1층 · 지하실',floor:['#7a5e48','#6b513e','#5c4534','#3e2d22'],wall:['#5e4a39','#4a3a2c','#35291f','#1c140f'],rock:['#b8aa97','#8f8272','#675d51','#3a332c']},

 {id:'bees',n:'벌집',d:'적이 있는 방에 들어가면 꿀벌 3마리가 돌진',w:4,u:1,cat:'도우미',f:p=>{p.bees=true}},
 // 방어
 {id:'shield',n:'수호 거품',d:'방마다 공격을 한 번 막아 줌',w:3,u:1,cat:'방어',f:p=>{p.shield=true;p.shieldOn=true}},

// ───────── 충돌 (호스트·게스트 공용) ─────────
// mode 0: 걷는 것(문은 열렸을 때만 통과) 1: 나는 것(바위 무시) 2: 총알
function solidAt(room,open,tx,ty,mode){
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS) return true;
  if(tx===0||ty===0||tx===COLS-1||ty===ROWS-1){
    if(mode===0&&open) for(const d in DOORT){const q=DOORT[d]; if(q[0]===tx&&q[1]===ty&&room.doors[d]&&(open===true||open===d)) return false;}
    return true;
  }
  return mode!==1 && room.rocks[ty*COLS+tx]===1;
}
function pushOut(e,r,room,open,mode,axis){
  let hit=false;
  const x0=Math.floor((e.x-r)/T),x1=Math.floor((e.x+r)/T),y0=Math.floor((e.y-r)/T),y1=Math.floor((e.y+r)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(!solidAt(room,open,tx,ty,mode)) continue;
    const rx=tx*T,ry=ty*T,cx=clamp(e.x,rx,rx+T),cy=clamp(e.y,ry,ry+T);
    const dx=e.x-cx,dy=e.y-cy,d2=dx*dx+dy*dy;
    if(d2>=r*r) continue;
    hit=true;
    if(d2>1e-6){const d=Math.sqrt(d2),k=(r-d)/d; e.x+=dx*k; e.y+=dy*k;}
    else if(axis===0) e.x=e.x<rx+T/2?rx-r:rx+T+r;
    else e.y=e.y<ry+T/2?ry-r:ry+T+r;
  }
  return hit;
}
function moveCircle(e,dx,dy,r,room,open,mode){
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/6));
  let hx=false,hy=false;
  for(let i=0;i<n;i++){
    e.x+=dx/n; if(pushOut(e,r,room,open,mode,0)) hx=true;
    e.y+=dy/n; if(pushOut(e,r,room,open,mode,1)) hy=true;
  }
  return {hx,hy};
}

let peer=null, conn=null, isHost=true, solo=false, myIdx=0, mode='lobby', roomCode='', resuming=false, wasLinked=false;
let guestIn=null, lastHeard=0, lastPing=0, lastTry=0, lastSave=0;
const PREFIX='jihasil-duo-', SAVE='jihasil-duo-save', JOIN='jihasil-duo-join';
const wall=()=>performance.now()/1000;
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function loadKey(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function readSave(){ try{ const o=JSON.parse(loadKey(SAVE)||'null'); return o&&o.v===1&&PAL[o.floor]?o:null; }catch(e){ return null; } }

function lobbyMain(){
  const sv=readSave();
  const cont=sv?`<button onclick="resumeGame()">이어하기</button><div class="tip" style="margin:0 0 6px">${sv.solo?'혼자 연습':'방 코드 '+sv.code} · ${PAL[sv.floor].name} · 골드 ${sv.gold||0}</div>`:'';
  showUI(`<h1>지하실 듀오</h1><div class="sub">둘이 힘을 합쳐 지하 5층 아래까지 탈출하세요</div>${cont}
  <button onclick="hostRoom()">방 만들기</button><button onclick="lobbyJoin()">방 참가</button>
  <div class="msg" id="msg"></div><button class="small" onclick="startSolo()">혼자 연습</button>
  <div class="tip">같은 와이파이에서 가장 잘 연결돼요 · 중간에 나가도 이어서 할 수 있어요</div>`);
}
function needPeer(){ if(typeof Peer==='undefined'){ lobbyMsg('연결 도구를 불러오지 못했어요. 인터넷을 확인해 주세요.'); return false;} return true; }
function genCode(){ const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c+=s[rand(s.length)]; return c; }
function healPeer(){ try{ if(peer&&!peer.destroyed&&peer.disconnected) peer.reconnect(); }catch(e){} }
function hookConn(c){
  c.on('data',m=>{ if(c!==conn) return; lastHeard=wall(); onData(m); });
  c.on('close',()=>{ if(c===conn){ conn=null; onLost(); } });
  c.on('error',()=>{});
}
// ── 방장 ──
function openHostPeer(code){
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer(PREFIX+code);
  peer.on('connection',c=>{ hookConn(c); c.on('open',()=>{ if(conn&&conn!==c){ try{ conn.close(); }catch(e){} } conn=c; lastHeard=wall(); onGuestJoin(); }); });
  peer.on('disconnected',()=>setTimeout(healPeer,1500));
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      if(resuming){ lobbyMsg('방 코드를 되찾는 중… 잠시만요'); setTimeout(()=>openHostPeer(code),3000); }
      else hostRoom(); }
    else if(['network','server-error','socket-error','socket-closed','disconnected'].includes(e.type)) setTimeout(healPeer,3000);
    else lobbyMsg('연결 오류: '+e.type); });
}
function hostRoom(){
  if(!needPeer()) return;
  isHost=true; myIdx=0; resuming=false; roomCode=genCode();
  showUI(`<div class="sub">방 코드</div><div class="code">${roomCode}</div>
  <div class="msg" id="msg">친구가 이 코드를 입력하길 기다리는 중…</div>
  <button id="startBtn" disabled onclick="hostStart()">게임 시작</button><br><button class="small" onclick="toLobby()">처음으로</button>`);
  openHostPeer(roomCode);
}
function onGuestJoin(){
  guestIn=null;
  if(mode==='play'){ send({t:'start'}); sendRoom(); banner('친구가 돌아왔어요!','이어서 함께 해요'); }
  else { lobbyMsg('친구가 들어왔어요! (나: 1P 파랑 · 친구: 2P 분홍)'); const b=document.getElementById('startBtn'); if(b) b.disabled=false; }
}
function hostStart(){ send({t:'start'}); mode='play'; hideUI(); newGame(); }
function startSolo(){ solo=true; isHost=true; myIdx=0; mode='play'; hideUI(); newGame(); }
function resumeGame(){
  const sv=readSave(); if(!sv){ lobbyMain(); return; }
  isHost=true; myIdx=0; solo=!!sv.solo; roomCode=sv.code||'';
  if(!solo){ if(!needPeer()) return; resuming=true; openHostPeer(roomCode); }

function lobbyJoin(){
  const last=loadKey(JOIN)||'';
  showUI(`<div class="sub">친구에게 받은 방 코드</div><input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" value="${last}"><br>
  <button onclick="joinRoom()">참가</button><button class="small" onclick="lobbyMain()">뒤로</button><div class="msg" id="msg"></div>`);

function joinRoom(){
  if(!needPeer()) return;
  const code=document.getElementById('codeIn').value.trim().toUpperCase();
  if(code.length!==4){ lobbyMsg('코드 4자리를 입력해 주세요'); return; }
  isHost=false; myIdx=1; roomCode=code; store(JOIN,code); lobbyMsg('연결 중…');
  openGuestPeer();
}
function openGuestPeer(){
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer();
  peer.on('open',()=>guestConnect());
  peer.on('disconnected',()=>setTimeout(healPeer,1500));
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){ if(!wasLinked) lobbyMsg('그 코드의 방을 찾을 수 없어요. 방장이 방을 열었는지 확인해 주세요'); }
    else if(['network','server-error','socket-error','socket-closed','disconnected'].includes(e.type)) setTimeout(healPeer,3000);
    else if(!wasLinked) lobbyMsg('연결 오류: '+e.type); });
}
function guestConnect(){
  lastTry=wall();
  if(!peer||peer.destroyed){ openGuestPeer(); return; }
  if(peer.disconnected){ healPeer(); return; }
  const c=peer.connect(PREFIX+roomCode,{serialization:'json',reliable:true});
  hookConn(c);
  c.on('open',()=>{ if(conn&&conn!==c){ try{ conn.close(); }catch(e){} } conn=c; lastHeard=wall(); wasLinked=true;
    if(mode!=='play') lobbyMsg('연결됐어요! 방장이 시작하길 기다리는 중… (나: 2P 분홍)'); });
}
function onLost(){
  guestIn=null;
  if(mode!=='play'){ lobbyMsg(isHost?'친구 연결이 끊겼어요. 다시 들어오길 기다리는 중…':'연결이 끊겼어요. 다시 연결하는 중…'); const b=document.getElementById('startBtn'); if(b) b.disabled=true; }
}
function onData(m){
  if(m.t==='ping') return;
  if(isHost){ if(m.t==='i') guestIn=m; else if(m.t==='act'&&G) (G.actQ=G.actQ||[]).push(1); return; }
  if(m.t==='start'){ mode='play'; phaseUI=''; hideUI(); }
  else if(m.t==='room') applyRoom(m);
  else if(m.t==='s') applySnap(m);
}
// 매 프레임: 생존 신호, 응답 없는 연결 정리, 자동 재연결, 저장
function netTick(){
  if(solo&&isHost){ if(mode==='play'&&wall()-lastSave>3) saveGame(); return; }
  if(!peer) return;
  const t=wall();
  if(linked()&&t-lastPing>1){ lastPing=t; send({t:'ping'}); }
  if(conn&&t-lastHeard>6){ const c=conn; conn=null; try{ c.close(); }catch(e){} onLost(); }
  if(!isHost&&wasLinked&&!linked()&&t-lastTry>4) guestConnect();
  if(isHost&&mode==='play'&&t-lastSave>3) saveGame();
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(isHost&&mode==='play') saveGame(); } else { healPeer(); netTick(); } });
addEventListener('pagehide',()=>{ if(isHost&&mode==='play') saveGame(); });

// ───────── 소리 (음원 파일 없이 전부 코드로 합성) ─────────
const SND={ctx:null,master:null,mus:null,sfx:null,echo:null,noise:null,on:loadKey('jihasil-duo-sound')!=='0',last:{}};
function audioInit(){
  if(SND.ctx){ if(SND.ctx.state==='suspended'&&!document.hidden) SND.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  try{
    const c=new AC(); SND.ctx=c;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6; comp.connect(c.destination); // 소리가 겹쳐도 찢어지지 않게
    SND.master=c.createGain(); SND.master.gain.value=SND.on?1:0; SND.master.connect(comp);
    SND.mus=c.createGain(); SND.mus.gain.value=0.34; SND.mus.connect(SND.master);
    SND.sfx=c.createGain(); SND.sfx.gain.value=0.8; SND.sfx.connect(SND.master);
    const d=c.createDelay(); d.delayTime.value=0.27; const fb=c.createGain(); fb.gain.value=0.3; const wet=c.createGain(); wet.gain.value=0.4;

function genFloor(fl){
  const total=5+fl+3;
  for(let tries=0;tries<300;tries++){
    const cells=new Map(); cells.set(key(4,4),[4,4]); const q=[[4,4]]; let guard=0;
    while(cells.size<total&&guard++<3000){
      if(!q.length){ const arr=[...cells.values()]; q.push(arr[rand(arr.length)]); }
      const [x,y]=q.shift();
      for(const d of shuffle(['u','d','l','r'])){
        if(cells.size>=total) break;
        const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
        if(nx<0||ny<0||nx>8||ny>8||cells.has(key(nx,ny))) continue;
        let n=0; for(const e of Object.values(DIRS)) if(cells.has(key(nx+e[0],ny+e[1]))) n++;
        if(n>1||Math.random()<0.5) continue;
        cells.set(key(nx,ny),[nx,ny]); q.push([nx,ny]);
      }
    }
    if(cells.size<total) continue;
    const nb=(x,y)=>Object.values(DIRS).filter(e=>cells.has(key(x+e[0],y+e[1]))).length;
    const dd={[key(4,4)]:0}, bq=[[4,4]];
    for(let i=0;i<bq.length;i++){ const [x,y]=bq[i]; for(const e of Object.values(DIRS)){ const k=key(x+e[0],y+e[1]); if(cells.has(k)&&dd[k]===undefined){ dd[k]=dd[key(x,y)]+1; bq.push([x+e[0],y+e[1]]); } } }
    const dead=[...cells.values()].filter(([x,y])=>!(x===4&&y===4)&&nb(x,y)===1).sort((a,b)=>dd[key(...b)]-dd[key(...a)]);
    if(dead.length<2) continue;
    const boss=dead[0], item=dead[1+rand(dead.length-1)];
    if(dd[key(...boss)]<2) continue;
    const rooms=[], rmap={};
    for(const [x,y] of cells.values()){
      const type=(x===4&&y===4)?'start':(x===boss[0]&&y===boss[1])?'boss':(x===item[0]&&y===item[1])?'shop':'normal';
      const doors={}; for(const d in DIRS) doors[d]=cells.has(key(x+DIRS[d][0],y+DIRS[d][1]));
      const r={gx:x,gy:y,type,doors,rocks:genRocks(type),cleared:type==='start'||type==='shop',visited:false,pickups:[],trap:null};
      if(type==='shop') for(let k=0;k<5;k++){ const it=rollItem(); r.pickups.push({id:nid(),kind:'i',x:W/2+(k-2)*80,y:H/2+8,item:it,price:PRICE[ITEM[it].cat]}); }
      rooms.push(r); rmap[key(x,y)]=r;
    }
    return {rooms,rmap,start:rmap[key(4,4)]};
  }
  throw new Error('map gen failed');
}
function genRocks(type){

  const n=rand(5);
  for(let c=0;c<n;c++){
    const x=1+rand(CX-1), y=1+rand(ROWS-2), w=1+rand(2), h=1+rand(2);
    for(let yy=y;yy<y+h&&yy<ROWS-1;yy++) for(let xx=x;xx<x+w&&xx<CX;xx++){
      if(yy===CY) continue; // 가운데 가로줄·세로줄은 비워서 모든 문이 이어지게
      r[yy*COLS+xx]=1; r[yy*COLS+(COLS-1-xx)]=1;
    }
  }
  // 막혀서 못 가는 빈칸은 바위로 채움
  const seen=new Uint8Array(COLS*ROWS), q=[CY*COLS+CX]; seen[q[0]]=1;
  for(let h=0;h<q.length;h++){ const i=q[h],x=i%COLS,y=(i/COLS)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(nx<1||ny<1||nx>COLS-2||ny>ROWS-2) continue;
      const j=ny*COLS+nx; if(seen[j]||r[j]) continue; seen[j]=1; q.push(j); } }
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++){ const i=y*COLS+x; if(!r[i]&&!seen[i]) r[i]=1; }
  return r;
}

function buildFlow(){

  for(let h=0;h<q.length;h++){ const i=q[h],x=i%COLS,y=(i/COLS)|0;
    for(const [dx,dy] of N8){ const nx=x+dx,ny=y+dy; if(nx<1||ny<1||nx>COLS-2||ny>ROWS-2) continue;
      if(dx&&dy&&(room.rocks[y*COLS+nx]||room.rocks[ny*COLS+x])) continue;
      const j=ny*COLS+nx; if(room.rocks[j]||d[j]<=d[i]+1) continue; d[j]=d[i]+1; q.push(j); } }

function flowDir(e,tg){
  const tx=clamp(Math.floor(e.x/T),1,COLS-2), ty=clamp(Math.floor(e.y/T),1,ROWS-2), i=ty*COLS+tx, d=G.flow, R=G.cur.rocks;

    if(dx&&dy&&(R[ty*COLS+nx]||R[ny*COLS+tx])) continue;
    const j=ny*COLS+nx; if(d[j]<bd){ bd=d[j]; best=j; } }
  return Math.atan2(((best/COLS|0)+0.5)*T-e.y,(best%COLS+0.5)*T-e.x);
}

function updateEnemy(e,dt){

function updateBoss(e,dt,tg,mv){

    if(!e.vx&&!e.vy){ e.vx=50; e.vy=38; }

    e.s1-=dt; e.s2-=dt;

    if(e.s2<=0){ e.s2=1.5; e.k++; if(e.k%3===0) ring(e,10,115,Math.random()); else spread(e,tg,3,0.3,140); }

    else if(e.st==='charge'){ const h=mv(e.vx,e.vy); if(h.hx){ e.vx=-e.vx; e.b++; } if(h.hy){ e.vy=-e.vy; e.b++; }

const untouchable=e=>e.wake>0||e.z>20||e.alpha<0.5;
function freeSpot(x,y){ x=clamp(x,T+8,W-T-8); y=clamp(y,T+8,H-T-8);

  for(let d=1;d<6;d++) for(let oy=-d;oy<=d;oy++) for(let ox=-d;ox<=d;ox++){ const nx=tx+ox, ny=ty+oy;
    if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&!R[ny*COLS+nx]) return [(nx+0.5)*T,(ny+0.5)*T]; }
  return [W/2,H/2]; }
function addCoin(x,y,v){ const [cx,cy]=freeSpot(x+rr(-8,8),y+rr(-8,8)); G.cur.pickups.push({id:nid(),kind:'g',x:cx,y:cy,v}); G.pickups=G.cur.pickups; }

function tearHit(b,e){

function explode(b){ fx('boom',b.x,b.y,0);

function update(dt,inp){
  G.time+=dt;
  if(G.banner&&G.banner.t>0) G.banner.t-=dt;
  if(G.phase!=='play') return;

  me.ax=inp.ax; me.ay=inp.ay; me.shoot=inp.sh;

    if(d>0&&d<m){ const k=(m-d)/d*0.5; if(a.type!=='boss'){ a.x-=dx*k; a.y-=dy*k; } if(b.type!=='boss'){ b.x+=dx*k; b.y+=dy*k; } } }
  for(const e of E) if(e.type!=='boss'&&!e.dead) pushOut(e,e.r,room,false,EN[e.type].fly?1:0,0); // 밀려서 바위·벽에 박히지 않게
  // 위성
  P.forEach(p=>{ if(!p.orb||p.down) return; p.oa+=dt*3;
    for(let k=0;k<p.orb;k++){ const a=p.oa+k*Math.PI*2/p.orb, o={x:p.x+Math.cos(a)*30,y:p.y-4+Math.sin(a)*30};
      for(const e of E) if(!e.dead&&!untouchable(e)&&dist(e,o)<e.r+6) hitEnemy(e,15*dt,0,0,P.indexOf(p));
      for(const b of G.bullets) if(b.team==='e'&&dist(b,o)<b.r+6) b.dead=true; } });
  // 쿨타임 아이템
  if(G.freezeT>0) G.freezeT-=dt;
  if(G.actQ&&G.actQ.length){ for(const i of G.actQ) if(P[i]) useActive(P[i],i); G.actQ=[]; }
  P.forEach((p,i)=>{ if(p.aT>0) p.aT=Math.max(0,p.aT-dt); if(p.frenzyT>0) p.frenzyT-=dt;
    for(const id in p.autos){ if(p.autos[id]>0) p.autos[id]=Math.max(0,p.autos[id]-dt);
      else if(p.shoot&&!p.down&&!p.gone&&E.length){ runAuto(p,i,id); p.autos[id]=ITEM[id].auto; } } });

  // 아이템 설명창 (터치한 아이템 위)
  if(infoTip&&now<infoTip.until){
    const k=v.pickups.find(q=>q.kind==='i'&&q.item===infoTip.id&&Math.abs(q.x-infoTip.x)<2&&Math.abs(q.y-infoTip.y)<2);
    if(!k) infoTip=null;
    else { const it=ITEM[k.item], cp=!!(me.coupon), pr=k.price?(cp?Math.ceil(k.price*0.7):k.price):0;
      const ic=itemSpr(it.id), t1=ptext(it.n,13,'#3a2010',null), t2=ptext(it.d,11,'#6a4628',null),
        t3=ptext(`${it.cat=='경제'?'골드':it.cat}${pr?` · ${pr}골드${cp?' (할인)':''}`:' · 무료'}`,11,pr&&(v.gold||0)<pr?'#b02a1a':'#8a6a40',null);
      const w=Math.max(t1.width+ic.width+5,t2.width,t3.width)+16, h=Math.max(t1.height,ic.height)+t2.height+t3.height;
      const x=clamp(Math.round((ox+k.x/A*sc)/hs-w/2),12,hw-w-12), y=clamp(Math.round((oy+(k.y/A-24)*sc)/hs-h),8,hh-h-8);
      g.globalAlpha=clamp((infoTip.until-now)/0.3,0,1); scroll(g,x,y,w,h);
      g.drawImage(ic,x+8,y+1); g.drawImage(t1,x+8+ic.width+5,y+Math.max(0,Math.round((ic.height-t1.height)/2))+1);
      const y2=y+Math.max(t1.height,ic.height); g.drawImage(t2,x+8,y2); g.drawImage(t3,x+8,y2+t2.height-3); g.globalAlpha=1; } }
  // 조이스틱
  const SRh=Math.round(SR/hs), KR=Math.round(24/hs);
  for(const [s,lab,dx] of [[sticks.L,'이동',safe.l+90],[sticks.R,'공격',cw-safe.r-90]]){
    if(s.id!==null){ g.globalAlpha=0.35; blit(g,ringSpr(SRh,false),s.ox/hs,s.oy/hs); g.globalAlpha=0.4; blit(g,ringSpr(KR,true),(s.ox+s.vx*SR)/hs,(s.oy+s.vy*SR)/hs); }
    else { const cx=dx/hs, cy=(ch-safe.b-80)/hs; g.globalAlpha=0.14; blit(g,ringSpr(SRh,false),cx,cy); g.globalAlpha=0.3; drawText(g,lab,10,'#ffffff',null,cx,cy-8,'c'); }
    g.globalAlpha=1; }
}
const LOBBY={room:{doors:{u:1,d:1,l:1,r:1},rocks:new Uint8Array(COLS*ROWS),type:'lobby',gx:4,gy:4},open:false,floor:1,map:null,cur:[4,4],
  players:[{x:W/2-70,y:H/2+40,fa:Math.PI/2,idx:0,down:false,inv:false,rev:0,orb:0,oa:0},{x:W/2+70,y:H/2+40,fa:Math.PI/2,idx:1,down:false,inv:false,rev:0,orb:0,oa:0}],
  enemies:[],bullets:[],pickups:[],trap:null};
function render(v,dt){
  lastV=v;
  renderWorld(v||LOBBY,dt);
  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
  const kx=shake>0?(rand(3)-1)*sc:0, ky=shake>0?(rand(3)-1)*sc:0;
  ctx.drawImage(lo,Math.round((ox+kx)*dpr),Math.round((oy+ky)*dpr),Math.round(AW*sc*dpr),Math.round(AH*sc*dpr));
  if(v){ drawHUD(v); ctx.drawImage(hud,0,0,Math.round(hw*hs*dpr),Math.round(hh*hs*dpr)); }
  if(fade>0){ ctx.fillStyle=`rgba(0,0,0,${clamp(fade/0.35,0,1)})`; ctx.fillRect(0,0,cv.width,cv.height); }
  if(flashT>0){ flashT-=dt; ctx.fillStyle=`rgba(255,255,240,${clamp(flashT/0.18,0,1)*0.55})`; ctx.fillRect(0,0,cv.width,cv.height); }
}

// ───────── 내가 먹은 아이템 창 ─────────
const ICONURL={}; const iconURL=id=>ICONURL[id]||(ICONURL[id]=itemSpr(id).toDataURL());
function openInv(){ const v=lastV; if(!v) return; const me=v.players[myIdx]||v.players[0], ids=(me.ex&&me.ex.it?me.ex.it.split(','):[]).filter(x=>ITEM[x]);
  const cnt={}, order=[]; for(const id of ids){ if(!cnt[id]){ cnt[id]=0; order.push(id); } cnt[id]++; }
  document.getElementById('invGrid').innerHTML=order.length?order.map(id=>`<button class="icell" onclick="invPick(this,'${id}')"><img src="${iconURL(id)}" alt="">${cnt[id]>1?`<span>×${cnt[id]}</span>`:''}</button>`).join(''):'<div class="tip">아직 먹은 아이템이 없어요</div>';
  document.getElementById('invInfo').textContent='아이템을 누르면 능력을 볼 수 있어요';
  document.getElementById('inv').style.display='flex'; }
function invPick(el,id){ const it=ITEM[id]; document.querySelectorAll('.icell').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');
  document.getElementById('invInfo').innerHTML=`<b>${it.n}</b> · ${it.cat=='경제'?'골드':it.cat=='사용'?'직접 사용':it.cat=='자동'?'자동 발동':it.cat}<br>${it.d}`; }
function closeInv(){ document.getElementById('inv').style.display='none'; }
// ───────── 게임 오버·승리 화면 ─────────
let phaseUI='play';
function fmt(t){ t=Math.round(t); return `${t/60|0}분 ${String(t%60).padStart(2,'0')}초`; }
function setPhaseUI(ph,time,floor,earned){
  if(ph===phaseUI) return; phaseUI=ph;
  if(ph==='wait'){ showUI(`<h1>친구를 기다리는 중</h1><div class="sub">친구가 '방 참가'에 이 코드를 넣으면 이어서 해요</div><div class="code">${roomCode}</div>
    <div class="tip">진행 상황은 이 폰에 저장돼 있어요</div><br><button class="small" onclick="toLobby()">처음 화면으로</button>`); return; }
  if(ph==='lost'){ showUI(`<h1>연결이 끊겼어요</h1><div class="sub">방장에게 다시 연결하는 중…<br>방장이 게임을 다시 열면 자동으로 이어져요</div>
    <div class="code">${roomCode}</div><button class="small" onclick="toLobby()">처음 화면으로</button>`); return; }
  if(ph==='play'){ hideUI(); return; }
  if(ph==='over') sfx('lose'); else if(ph==='win') sfx('win');
  const btn=isHost?(ph==='over'?`<button onclick="restartRun()">1층부터 다시</button>`:`<button onclick="newGame()">처음부터 다시</button>`)
    :`<div class="msg">방장이 다시 시작하길 기다리는 중…</div>`;
  if(ph==='over'){ const e=earned||0; showUI(`<h1>${solo?'쓰러졌어요':'둘 다 쓰러졌어요'}</h1><div class="sub">이번 판에서 모은 가치 ${e}골드<br>그 절반인 <b>${Math.floor(e*0.5)}골드</b>어치 아이템을 들고 1층부터 다시 시작해요</div>${btn}`); }
  else showUI(`<h1>탈출 성공!</h1><div class="sub">그림자 왕을 물리쳤어요 · 플레이 시간 ${fmt(time)}</div>${btn}`);
}

// ───────── 메인 루프 ─────────
let last=0, acc=0, snapT=0;
function frame(ts){
  const t=ts/1000, dt=Math.min(0.05,t-last||0); last=t; now=t;
  if(shake>0) shake-=dt; if(fade>0) fade-=dt;
  let v=null;
  if(mode==='play'){
    const inp=readInput();
    if(isHost){
      const wait=!solo&&!linked();
      if(wait) acc=0; else { acc+=dt; while(acc>=1/60){ update(1/60,inp); acc-=1/60; } }
      snapT-=dt; if(snapT<=0&&!solo){ snapT=0.05; send(buildSnap()); G.fx=[]; }
      if(solo||wait) G.fx=[];
      v=hostView(dt); setPhaseUI(wait?'wait':G.phase,G.time,G.floor,G.earned);
    } else { if(linked()) guestFrame(dt,inp); v=guestView(); if(!linked()) setPhaseUI('lost'); else if(L.cur) setPhaseUI(L.cur.ph,L.cur.tm,L.floor,L.cur.ea); }
  }
  musicSet(mode!=='play'||!v?'lobby':(v.phase==='over'||v.phase==='win')?'none':(v.room.type==='boss'&&v.boss)?'boss'+v.floor:v.room.type==='shop'?'shop':'f'+v.floor);
  { const ab=document.getElementById('actBtn'), me=v&&mode==='play'?(v.players[myIdx]||v.players[0]):null, ac=me&&me.ex&&me.ex.ac;
    if(ab.dataset.ac!==(ac||'')){ ab.dataset.ac=ac||''; ab.style.display=ac?'block':'none'; if(ac) document.getElementById('actImg').src=iconURL(ac); }
    if(ac){ const k=(me.ex.at||0)/100; document.getElementById('actCd').style.height=Math.round(k*100)+'%'; ab.classList.toggle('ready',k<=0); } }
  const ib=document.getElementById('invBtn'), showInv=mode==='play'&&!!v; if(ib.style.display!==(showInv?'block':'none')) ib.style.display=showInv?'block':'none';
  netTick();
  render(v,dt);
  requestAnimationFrame(frame);
}
resize(); lobbyMain(); if(!SND.on) document.getElementById('sndBtn').textContent='✕'; requestAnimationFrame(frame);
</script>
